steps:
      - name: 📥 Clone Ladybird
        run: |
          git clone --depth=1 https://github.com/LadybirdBrowser/ladybird.git ${{ github.workspace }}/ladybird
      - name: 🔧 Install dependencies
        run: |
          sudo apt update -y
          sudo apt install \
          autoconf \
          autoconf-archive \
          automake \
          build-essential \
          ccache \
          cmake \
          curl \
          fonts-liberation2 \
          git \
          libdrm-dev \
          libgl1-mesa-dev \
          libtool \
          nasm \
          ninja-build \
          pkg-config \
          python3-venv \
          qt6-base-dev \
          qt6-tools-dev-tools \
          qt6-wayland \
          tar \
          unzip \
          zip
      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: 🦀 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.workspace }}/ladybird
      - name: 🏗️ Configure
        working-directory: ${{ github.workspace }}/ladybird
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
      - name: ⚙️ Build
        working-directory: ${{ github.workspace }}/ladybird
        run: cmake --build build -j$(nproc)
      - name: 📦 Stage artifact
        run: |
          mkdir -p lb
          cp ${{ github.workspace }}/ladybird/build/bin/Ladybird lb/ladybird_x86_linux
          echo "✅ Binary size: $(du -sh lb/ladybird_x86_linux | cut -f1)" >> $GITHUB_STEP_SUMMARY
      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladybird_${{ needs.artifact-version.outputs.package }}
          path: lb
          retention-days: 30
          if-no-files-found: error
