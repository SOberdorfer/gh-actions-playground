name: Build Ladybird
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Build Ladybird'
        default: test
        type: environment
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
permissions:
  id-token: write
  contents: read
jobs:
  artifact-version:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.artifact-version }}
    steps:
      - name: 📦 Retrieve Ladybird HEAD hash
        id: package
        run: |
          ARTIFACT_VERSION=$(git ls-remote https://github.com/LadybirdBrowser/ladybird.git HEAD | cut -c1-7)
          echo "📝 Retrieved version: $ARTIFACT_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "artifact-version=${ARTIFACT_VERSION}-" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    needs: artifact-version
    environment: ${{ inputs.environment }}
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: 📥 Clone Ladybird
        run: |
          git clone --depth=1 https://github.com/LadybirdBrowser/ladybird.git ${{ github.workspace }}/ladybird
      - name: 🔧 Install dependencies
        run: |
          sudo apt update -y
          sudo apt install \
          autoconf \
          autoconf-archive \
          automake \
          build-essential \
          ccache \
          cmake \
          curl \
          fonts-liberation2 \
          git \
          libdrm-dev \
          libgl1-mesa-dev \
          libmimalloc-dev \
          libtool \
          nasm \
          ninja-build \
          pkg-config \
          python3-venv \
          qt6-base-dev \
          qt6-tools-dev-tools \
          qt6-wayland \
          tar \
          unzip \
          zip
      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: 🦀 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.workspace }}/ladybird
      - name: 📦 Enable vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      # - name: 📦 Bootstrap vcpkg
      #   working-directory: ${{ github.workspace }}/ladybird
      #   run: |
      #     python3 Meta/Utils/build_vcpkg.py
      # - name: 🏗️ Configure
      #   working-directory: ${{ github.workspace }}/ladybird
      #   run: |
      #     cmake -B build \
      #       -G Ninja \
      #       --preset Release \
      #       -DCMAKE_C_COMPILER=clang \
      #       -DCMAKE_CXX_COMPILER=clang++
      - name: ⚙️ Build
        working-directory: ${{ github.workspace }}/ladybird
        run: ./${{ github.workspace }}/Meta/ladybird.py build --gui=Qt
      - name: 📦 Stage artifact
        run: |
          mkdir -p lb
          cp ${{ github.workspace }}/ladybird/build/bin/Ladybird lb/ladybird_x86_linux
          echo "✅ Binary size: $(du -sh lb/ladybird_x86_linux | cut -f1)" >> $GITHUB_STEP_SUMMARY
      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ladybird_${{ needs.artifact-version.outputs.package }}
          path: lb
          retention-days: 30
          if-no-files-found: error
